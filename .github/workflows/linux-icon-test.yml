# TEMPORARY -- verification harness for issue #2269 (Linux app icon).
# Remove this file, and .github/ci-tmp/, before opening the PR.
name: TEMP Linux icon test

on:
  push:
    branches:
      - fix/build-linux-icon
  workflow_dispatch:
    inputs:
      python_version:
        description: "Bundled Python version to test"
        type: choice
        required: true
        default: "3.13"
        options:
          - "3.12"
          - "3.13"
          - "3.14"
      strict_runtime:
        description: "Fail the job when the Xvfb runtime checks fail"
        type: boolean
        required: false
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ROOT: "${{ github.workspace }}"
  # patch_python_package_versions (common.sh) cd's into this.
  SDK_PYTHON: "${{ github.workspace }}/sdk/python"
  SCRIPTS: "${{ github.workspace }}/.github/scripts"
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  linux_icon:
    name: Linux icon (${{ matrix.leg }}, ${{ matrix.arch }})
    # 22.04 (glibc 2.35), not ubuntu-latest: the bundles are downloaded and
    # run on a real desktop, and a binary linked against 24.04's glibc 2.39
    # will not start on anything older. Both architectures are built because
    # a Linux VM on an Apple Silicon host is arm64, where an x64 bundle only
    # produces "Exec format error".
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm]
        leg: [default, themed, large, hostile]
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm
            runner: ubuntu-22.04-arm
          # No icon in assets: the template's 1024x1024 default is used, so
          # this leg proves the runner downscales it instead of letting GDK
          # drop it for exceeding the _NET_WM_ICON size cap.
          - leg: default
            artifact: flet-icon-test
            icon_size: 256x256
          - leg: themed
            artifact: flet-icon-test
            icon_size: 256x256
          # 512x512 must land in hicolor/512x512 and still be downscaled to
          # 256x256 for the window icon.
          - leg: large
            artifact: flet-icon-test
            icon_size: 256x256
          # Quotes/newlines/tabs in the description, space in the artifact.
          - leg: hostile
            artifact: flet icon test
            icon_size: 256x256

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Patch versions
        shell: bash
        run: |
          source "${SCRIPTS}/update_build_version.sh"
          source "${SCRIPTS}/common.sh"
          patch_python_package_versions

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt update --allow-releaseinfo-change
          LINUX_DEPS="$(uv run --project sdk/python/packages/flet-cli flet --version --json | jq -r '.linux_dependencies | join(" ")')"
          # xvfb and dbus ship with the runner image; xprop/xwininfo
          # (x11-utils), desktop-file-validate and the software GL driver do not.
          sudo apt-get install -y --no-install-recommends \
            $LINUX_DEPS x11-utils xvfb desktop-file-utils libgl1-mesa-dri
          sudo apt-get clean

      - name: Setup Flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        with:
          path: '.fvmrc'
          cache: true

      - name: Generate fixture app
        shell: bash
        env:
          LEG: ${{ matrix.leg }}
        run: |
          chmod +x .github/ci-tmp/*.sh
          .github/ci-tmp/make_fixture.sh "${LEG}" "${RUNNER_TEMP}/app-${LEG}" "${ROOT}"

      - name: Build Linux app
        shell: bash
        working-directory: ${{ runner.temp }}/app-${{ matrix.leg }}
        env:
          PYTHON_VERSION: ${{ inputs.python_version || '3.13' }}
          LEG: ${{ matrix.leg }}
        run: |
          set -o pipefail
          uv run flet build linux --python-version "${PYTHON_VERSION}" \
            --yes --verbose --build-number "${GITHUB_RUN_NUMBER}" \
            2>&1 | tee "${RUNNER_TEMP}/build-${LEG}.log"

      - name: Assert bundle contents
        shell: bash
        env:
          LEG: ${{ matrix.leg }}
        run: |
          uv run --project sdk/python/packages/flet-cli --with pyyaml \
            python .github/ci-tmp/assert_bundle.py \
            "${LEG}" "${RUNNER_TEMP}/app-${LEG}" "${ROOT}"

      - name: Validate desktop entry
        shell: bash
        env:
          LEG: ${{ matrix.leg }}
        run: |
          ENTRY="${RUNNER_TEMP}/app-${LEG}/build/linux/share/applications/com.flet.flet-icon-test.desktop"
          echo "--- $ENTRY"
          cat "$ENTRY"
          # Warnings (deprecated keys, hints) are informational; only spec
          # errors should fail the job.
          OUT="$(desktop-file-validate "$ENTRY" 2>&1 || true)"
          echo "$OUT"
          if echo "$OUT" | grep -q "error:"; then
            echo "!! desktop entry has spec errors" >&2
            exit 1
          fi

      - name: Package the bundle for download
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}/app-${{ matrix.leg }}
        env:
          LEG: ${{ matrix.leg }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          if [ ! -d build/linux ]; then
            echo "no bundle to package (build did not produce build/linux)"
            exit 0
          fi
          # tar, not the artifact zip: zip loses the executable bit and
          # mangles symlinks, so a downloaded bundle would not run.
          cat > build/linux/RUN_ME.txt <<EOF
          Flet Linux icon test bundle -- leg: ${LEG}

          Run it:
              ./${ARTIFACT}

          Check the X11 window icon (click the window when the cursor
          becomes a crosshair):
              xprop | grep -E "WM_CLASS|_NET_WM_ICON"
          Expect  WM_CLASS = "com.flet.flet-icon-test"
          and     _NET_WM_ICON = 256, 256, ...
          (256 even on the 'large' and 'default' legs -- that is the
          downscale working; before the fix an oversized icon was dropped
          entirely and _NET_WM_ICON was absent.)

          On Wayland the taskbar icon only appears once the desktop entry
          is installed:
              cp -r share/. ~/.local/share/
              sed -i "s|^Exec=.*|Exec=\\"\$PWD/${ARTIFACT}\\" %U|" \\
                ~/.local/share/applications/com.flet.flet-icon-test.desktop
              update-desktop-database ~/.local/share/applications
          Then relaunch, and look for "Flet Icon Test" in the app grid.
          EOF
          tar -czf "${RUNNER_TEMP}/bundle-${LEG}-${ARCH}.tar.gz" -C build linux
          ls -lh "${RUNNER_TEMP}/bundle-${LEG}-${ARCH}.tar.gz"

      - name: Assert runtime X11 properties (Xvfb)
        # Informational: it depends on Flutter obtaining a software GL
        # context under Xvfb, which is not guaranteed on a headless runner.
        # Never let it block the bundle upload, and never let it hang — the
        # script's own worst case is ~90s.
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        working-directory: ${{ runner.temp }}/app-${{ matrix.leg }}
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          GDK_BACKEND: x11
          ICON_SIZE: ${{ matrix.icon_size }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          timeout --kill-after=20s 240s \
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            "${ROOT}/.github/ci-tmp/assert_runtime.sh" \
            "com.flet.flet-icon-test" "${ICON_SIZE}" "./build/linux/${ARTIFACT}"

      - name: Upload bundle for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-icon-${{ matrix.leg }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/bundle-${{ matrix.leg }}-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/app-${{ matrix.leg }}/build/flutter/pubspec.yaml
            ${{ runner.temp }}/app-${{ matrix.leg }}/build/flutter/linux/app_icon.cmake
            ${{ runner.temp }}/app-${{ matrix.leg }}/build/flutter/web/manifest.json
            ${{ runner.temp }}/app-${{ matrix.leg }}/build/flutter/web/index.html
            ${{ runner.temp }}/build-${{ matrix.leg }}.log
            ${{ runner.temp }}/app-runtime.log
          if-no-files-found: warn
          retention-days: 5
