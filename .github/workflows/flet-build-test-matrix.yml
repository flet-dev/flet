name: Flet Build Test (matrix)

# Reusable workflow: runs the 14-target `flet build` matrix against a single
# bundled CPython release. Invoked from `flet-build-test.yml`, which calls it
# once per supported Python version so the UI groups jobs by version.

on:
  workflow_call:
    inputs:
      python_version:
        description: "Bundled CPython short version (e.g. 3.13)."
        type: string
        required: true
      extra_build_args:
        description: "Extra CLI args appended to `flet build`."
        type: string
        default: ""

env:
  ROOT: "${{ github.workspace }}"
  SDK_PYTHON: "${{ github.workspace }}/sdk/python"
  SCRIPTS: "${{ github.workspace }}/.github/scripts"
  UV_PYTHON: 3.12
  PYTHONUTF8: 1

  # https://flet.dev/docs/reference/environment-variables
  FLET_CLI_NO_RICH_OUTPUT: 1

  FLET_BUILD_EXTRA_ARGS: ${{ inputs.extra_build_args }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-26.04
            build_cmd: "flet build linux"
            artifact_name: linux-build-artifact
            artifact_path: build/linux
            needs_linux_deps: true

          - name: aab-ubuntu
            runner: ubuntu-26.04
            build_cmd: "flet build aab"
            artifact_name: aab-build-ubuntu-artifact
            artifact_path: build/aab
            needs_linux_deps: false

          - name: apk-ubuntu
            runner: ubuntu-26.04
            build_cmd: "flet build apk"
            artifact_name: apk-build-ubuntu-artifact
            artifact_path: build/apk
            needs_linux_deps: false

          - name: web-ubuntu
            runner: ubuntu-26.04
            build_cmd: "flet build web"
            artifact_name: web-build-ubuntu-artifact
            artifact_path: build/web
            needs_linux_deps: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Patch versions
        shell: bash
        run: |
          source "${SCRIPTS}/update_build_version.sh"
          source "${SCRIPTS}/common.sh"
          patch_python_package_versions

      - name: Install Linux dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
          sudo apt update --allow-releaseinfo-change
          LINUX_DEPS="$(uv run --project sdk/python/packages/flet-cli flet --version --json | jq -r '.linux_dependencies | join(" ")')"
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          sudo apt-get clean

      - name: Setup Flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        with:
          path: '.fvmrc'
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Runner diagnostics
        shell: bash
        run: |
          set +e
          grep -E '^(VERSION|VERSION_CODENAME)=' /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          echo "JAVA_HOME=$JAVA_HOME"; java -version 2>&1 | head -1
          clang --version | head -1; cmake --version | head -1; ldd --version | head -1
          findmnt -no FSTYPE,SIZE,OPTIONS /tmp; df -h /tmp /

      - name: Build app
        shell: bash
        working-directory: sdk/python/examples/apps/flet_build_test
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          echo "FLET_BUILD_EXTRA_ARGS='${FLET_BUILD_EXTRA_ARGS}'"
          uv run ${{ matrix.build_cmd }} --python-version "$PYTHON_VERSION" --yes --verbose --build-number ${{ github.run_number }} $FLET_BUILD_EXTRA_ARGS

      - name: GLIBC floor of compiled Linux bundle
        if: matrix.name == 'linux'
        shell: bash
        working-directory: sdk/python/examples/apps/flet_build_test
        run: |
          set +e
          find build/linux -type f \( -perm -u+x -o -name '*.so*' \) -print0 \
            | while IFS= read -r -d '' f; do
                file -b "$f" | grep -q '^ELF' || continue
                v=$(objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
                echo "${v:-none} $f"
              done | sort -V | tail -25

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}-py${{ inputs.python_version }}
          path: sdk/python/examples/apps/flet_build_test/${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: false
