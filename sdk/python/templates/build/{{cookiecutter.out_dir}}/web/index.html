<!DOCTYPE html>
<html>

<head>
  <base href="{{ cookiecutter.base_url }}">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="{{ cookiecutter.project_description }}">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="{{ cookiecutter.product_name }}">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>{{ cookiecutter.product_name }}</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Reload when WebKit restores the page from the back/forward cache instead
    // of resuming it. WebKit restores a Flutter app with its frame scheduling
    // broken: input and script keep running, but scheduled frames never
    // render, so the app silently freezes at its last painted state.
    //
    // In a packaged (Pyodide) app, Python state lives in the page and is lost
    // on reload - but WebKit's alternative is an app frozen at its last
    // painted frame, so a fresh start is still strictly better. Gated to
    // WebKit (every browser on iOS, Safari on macOS) because other engines
    // restore correctly and get to keep their state.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted &&
        navigator.vendor && navigator.vendor.startsWith('Apple')) {
        window.location.reload();
      }
    });
  </script>

  <script>
    var flet = {
      pyodide: true,
      multiView: false,
      noCdn: "{{ cookiecutter.no_cdn }}".toLowerCase() == "true",
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "{{ cookiecutter.base_url }}",
      assetBase: "{{ cookiecutter.base_url }}",
      routeUrlStrategy: "{{ cookiecutter.route_url_strategy }}",
      // Only pinned when bundling. Left null, Flutter resolves CanvasKit from
      // gstatic and the Noto fallback fonts from Google Fonts, and the build
      // skips shipping local copies. A host serving its own runtime can assign
      // these without also claiming a no-CDN build.
      {% if cookiecutter.no_cdn %}
      canvasKitBaseUrl: "{{ cookiecutter.base_url }}canvaskit/",
      {% else %}
      canvasKitBaseUrl: null,
      {% endif %}
      // .mjs is required: python-worker.js is a module worker and loads
      // the runtime via dynamic `import()`. Pyodide >= 0.29 also refuses
      // to run in classic workers. Use the local copy that `flet build`
      // drops into web/pyodide/ when --no-cdn is set; otherwise pull
      // from jsdelivr so the build artifact can stay slim.
      {% if cookiecutter.no_cdn %}
      pyodideUrl: "{{ cookiecutter.base_url }}pyodide/pyodide.mjs",
      {% else %}
      pyodideUrl: "https://cdn.jsdelivr.net/pyodide/v{{ cookiecutter.pyodide_version }}/full/pyodide.mjs",
      {% endif %}
      pythonModuleName: "{{ cookiecutter.python_module_name }}",
      webRenderer: "{{ cookiecutter.web_renderer }}",
      {% if cookiecutter.no_cdn %}
      fontFallbackBaseUrl: "assets/fonts/", // Noto Emoji, bundled
      {% else %}
      fontFallbackBaseUrl: null,            // Noto Emoji from Google Fonts
      {% endif %}
      appPackageUrl: "assets/app/app.zip"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      console.log("Flutter app loaded");
    });
  </script>
  <script src="python.js"></script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
