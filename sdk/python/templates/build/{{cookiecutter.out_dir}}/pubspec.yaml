name: '{{ cookiecutter.project_name }}'
description: '{{ cookiecutter.pubspec_description }}'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flet:
    path: ../../../../../packages/flet

  serious_python: 4.6.0

  # MsgPack codec used by the dart_bridge FletBackendChannel implementation
  # in lib/main.dart — matches the wire format flet's existing socket
  # transport already speaks.
  msgpack_dart: ^1.0.1

  package_info_plus: ^9.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  window_manager: ^0.5.1

dependency_overrides:
  flet:
    path: ../../../../../packages/flet
  screen_retriever: 0.2.1 # this one migrated to SPM, but 0.2.0 is used by some other packages
  # jni arrives transitively (path_provider -> path_provider_android ->
  # jni_flutter -> jni). 1.0.1 added global_jni_env.c, which passes a `va_list`
  # where a `void *` is expected: fine on x86_64, where va_list is an array type
  # that decays to a pointer, but a hard error on aarch64, where it's a struct.
  # That breaks `flet build linux` on ARM64 hosts. Generated projects have no
  # committed lock, so they always resolve the newest without this. Tracked
  # upstream at dart-lang/native#3498 — drop once a fixed jni is released.
  jni: 1.0.0

dev_dependencies:
  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true

  # The web (Pyodide) build gets `assets:` with app/app.zip injected here by
  # `flet build`; on native platforms the app ships unpacked inside the bundle
  # (placed by serious_python's platform build), so there is no app.zip asset.
