name: flet_webview
description: Flet WebView control
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  collection: ^1.16.0

  # The webview_all packages depend on each other with caret constraints, so
  # every one of them is pinned here to keep the whole set on a tested
  # release. 1.4.0 is the oldest release that can share an app with
  # webview_flutter (pulled in by google_mobile_ads via flet_ads): earlier
  # releases register the same platform view type and channel names.
  webview_all: 1.5.2
  webview_all_android: 1.5.2
  webview_all_linux: 1.5.2
  webview_all_ohos: 1.5.2
  webview_all_web: 1.5.2
  webview_all_windows: 1.5.2
  webview_all_wkwebview: 1.5.2
  webview_platform_interface: 1.5.2

  flet:
    path: ../../../../../../../packages/flet

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
