[project]
name = "flet-webview-all"
version = "0.1.8"
description = "FletWebviewAll control for Flet"
readme = "README.md"
authors = [{ name = "Flet contributors", email = "hello@flet.dev" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["flet>=0.86.5"]

[project.urls]
Homepage = "https://flet.dev"
Documentation = "https://flet.dev/docs/controls/webviewall"
Repository = "https://github.com/flet-dev/flet/tree/main/sdk/python/packages/flet-webview-all"
Issues = "https://github.com/flet-dev/flet/issues"

[tool.setuptools.package-data]
"flutter.flet_webview_all" = ["pubspec.yaml", "lib/**"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
