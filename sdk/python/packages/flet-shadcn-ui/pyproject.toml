[project]
name = "flet-shadcn-ui"
version = "0.1.0"
description = "Shadcn components for Flet apps."
readme = "README.md"
authors = [{ name = "Flet contributors", email = "hello@flet.dev" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "flet",
]

[project.urls]
Homepage = "https://flet.dev"
Documentation = "https://flet.dev/docs/controls/shadcnui"
Repository = "https://github.com/flet-dev/flet/tree/main/sdk/python/packages/flet-shadcn-ui"
Issues = "https://github.com/flet-dev/flet/issues"

[tool.setuptools.package-data]
"flet_shadcn_ui" = [
    "lucide_icons.json",
    "*.pyi",
]
"flutter.flet_shadcn_ui" = [
    "pubspec.yaml",
    "lib/**",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
