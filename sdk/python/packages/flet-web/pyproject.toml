[project]
name = "flet-web"
version = "0.1.0"
description = "Flet web client in Flutter."
authors = [{ name = "Appveyor Systems Inc.", email = "hello@flet.dev" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet",
    "fastapi >=0.115.12",
    "websockets >=13.0",
    "uvicorn >=0.35.0",
    # On Windows ARM, uvicorn's standard extras install from wheels only on Python 3.12
    # or later (PyYAML has none for 3.10 or 3.11) and with httptools 0.9.0 or later;
    # otherwise they need a C++ compiler. uvicorn falls back to h11 without them.
    "uvicorn[standard] >=0.35.0; sys_platform != 'win32' or platform_machine != 'ARM64' or python_version >= '3.12'",
    "httptools >=0.9.0; sys_platform == 'win32' and platform_machine == 'ARM64' and python_version >= '3.12'"
]

[project.urls]
Homepage = "https://flet.dev"
Repository = "https://github.com/flet-dev/flet"
Documentation = "https://flet.dev/docs"

[tool.setuptools.package-data]
"flet_web.web" = ["**/*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
