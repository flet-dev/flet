[project]
name = "flet-web"
version = "0.1.0"
description = "Flet web client in Flutter."
authors = [{ name = "Appveyor Systems Inc.", email = "hello@flet.dev" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet",
    "fastapi >=0.115.12",
    "uvicorn >=0.35.0",
    "websockets >=13.0"
]

[project.optional-dependencies]
# uvicorn's optional extras (httptools, uvloop, watchfiles, ...). uvicorn falls back
# to h11 and asyncio without them. httptools has no wheels for some platforms, such
# as Windows on ARM, where installing it needs a C++ compiler.
standard = ["uvicorn[standard] >=0.35.0"]

[project.urls]
Homepage = "https://flet.dev"
Repository = "https://github.com/flet-dev/flet"
Documentation = "https://flet.dev/docs"

[tool.setuptools.package-data]
"flet_web.web" = ["**/*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
