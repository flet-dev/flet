[project]
name = "webauth"
version = "0.1.0"
description = "Auth0 native + core WebAuth mobile example (PKCE, no client secret)"
requires-python = ">=3.10"
dependencies = [
    "flet",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop",
]

[tool.uv.sources]
flet = { path = "../../../packages/flet", editable = true }
flet-cli = { path = "../../../packages/flet-cli", editable = true }
flet-desktop = { path = "../../../packages/flet-desktop", editable = true }
flet-platform-assets = { path = "../../../packages/flet-platform-assets", editable = true }

[tool.flet]
product = "WebAuth"
artifact = "webauth"
project = "webauth"
company = "Flet"
org = "com.flet"
copyright = "Copyright (C) Flet"

[tool.flet.app]
path = "src"
# Ship .env into the APK (excluded by default). Auth0 Native apps are public
# clients — only domain + client_id (no secret).
include = [".env"]

[tool.flet.web_auth]
callback_scheme = "com.flet.webauth.auth"

[tool.flet.dev_packages]
flet = "../../../packages/flet"
