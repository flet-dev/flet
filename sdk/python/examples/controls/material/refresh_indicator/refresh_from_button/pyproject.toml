[project]
name = "refresh-indicator-refresh-from-button"
version = "1.0.0"
description = "Refreshes a list from an app bar button with RefreshIndicator.show(), for desktop and web."
requires-python = ">=3.10"
keywords = ["refresh", "button", "desktop"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Layout/RefreshIndicator"]

[tool.flet.metadata]
title = "Refresh from a button"
docs_intro = """On desktop and web, where the pull gesture isn't available, call `show()`, for example from a button, to show the indicator and run `on_refresh`:"""
controls = ["AppBar", "IconButton", "SafeArea", "RefreshIndicator", "ListView", "ListTile", "Text"]
layout_pattern = "single-panel"
complexity = "basic"
features = ["programmatic refresh", "custom indicator colors"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
