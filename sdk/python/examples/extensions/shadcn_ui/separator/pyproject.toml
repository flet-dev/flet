[project]
name = "shadcn-ui-separator"
version = "1.0.0"
description = "Horizontal and vertical separators dividing text and links."
requires-python = ">=3.10"
keywords = ["shadcn", "separator", "divider", "line", "layout"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-shadcn-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Extensions/Shadcn"]

[tool.flet.metadata]
title = "Shadcn Separator"
controls = ["SafeArea", "Column", "Row", "Text", "Separator"]
layout_pattern = "sections"
complexity = "basic"
features = ["horizontal", "vertical"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
