[project]
name = "shadcn-ui-alert"
version = "1.0.0"
description = "Default and destructive alerts with Lucide icons, titles and descriptions."
requires-python = ">=3.10"
keywords = ["shadcn", "alert", "callout", "message", "error"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-shadcn-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Extensions/Shadcn"]

[tool.flet.metadata]
title = "Shadcn Alert"
controls = ["SafeArea", "Column", "Alert"]
layout_pattern = "sections"
complexity = "basic"
features = ["variants", "icons"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
