[project]
name = "shadcn-ui-calendar"
version = "1.0.0"
description = "Calendar with a selected day and a live selection label."
requires-python = ">=3.10"
keywords = ["shadcn", "calendar", "date", "day picker"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-shadcn-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Extensions/Shadcn"]

[tool.flet.metadata]
title = "Shadcn Calendar"
controls = ["SafeArea", "Column", "Text", "Calendar"]
layout_pattern = "form"
complexity = "basic"
features = ["change handling", "selected day"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
