[project]
name = "shadcn-ui-resizable"
version = "1.0.0"
description = "Horizontal panel group with a nested vertical group and draggable handles."
requires-python = ">=3.10"
keywords = ["shadcn", "resizable", "panels", "split view", "layout"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-shadcn-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Extensions/Shadcn"]

[tool.flet.metadata]
title = "Shadcn ResizablePanelGroup"
controls = ["SafeArea", "Container", "Text", "ResizablePanelGroup", "ResizablePanel"]
layout_pattern = "split-view"
complexity = "basic"
features = ["resizing", "nested groups"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
