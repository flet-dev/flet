[project]
name = "shadcn-ui-badge"
version = "1.0.0"
description = "Badge variants that report which one was clicked."
requires-python = ">=3.10"
keywords = ["shadcn", "badge", "tag", "label", "status"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-shadcn-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Extensions/Shadcn"]

[tool.flet.metadata]
title = "Shadcn Badge"
controls = ["SafeArea", "Column", "Row", "Text", "Badge"]
layout_pattern = "inline-actions"
complexity = "basic"
features = ["variants", "click handling"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
