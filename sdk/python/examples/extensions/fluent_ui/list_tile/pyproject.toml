[project]
name = "fluent-ui-list-tile"
version = "1.0.0"
description = "Mail folder list with single selection."
requires-python = ">=3.10"
keywords = ["fluent", "list tile", "list", "selection"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent ListTile"
controls = ["SafeArea", "Column", "Text", "ListTile"]
layout_pattern = "list-detail"
complexity = "basic"
features = ["selection handling", "leading icon", "subtitle"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
