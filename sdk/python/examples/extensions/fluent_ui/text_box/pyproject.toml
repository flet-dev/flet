[project]
name = "fluent-ui-text-box"
version = "1.0.0"
description = "Name, password and multiline text boxes with a live greeting."
requires-python = ">=3.10"
keywords = ["fluent", "text box", "input", "password"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent TextBox"
controls = ["SafeArea", "Column", "Text", "TextBox"]
layout_pattern = "form"
complexity = "basic"
features = ["change handling", "password", "multiline", "prefix icon"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
