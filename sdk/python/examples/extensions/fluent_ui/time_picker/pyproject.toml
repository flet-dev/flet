[project]
name = "fluent-ui-time-picker"
version = "1.0.0"
description = "Pick times in 12-hour and 24-hour formats."
requires-python = ">=3.10"
keywords = ["fluent", "time", "picker"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent TimePicker"
controls = ["SafeArea", "Column", "Text", "TimePicker"]
layout_pattern = "form"
complexity = "basic"
features = ["change handling", "24-hour format"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
