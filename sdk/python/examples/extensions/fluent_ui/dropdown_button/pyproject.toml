[project]
name = "fluent-ui-dropdown-button"
version = "1.0.0"
description = "Sort a list of files with a drop-down button."
requires-python = ">=3.10"
keywords = ["fluent", "dropdown", "button", "menu"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent DropDownButton"
controls = ["SafeArea", "Column", "Text", "DropDownButton", "MenuFlyoutItem"]
layout_pattern = "list"
complexity = "basic"
features = ["menu", "selected item", "click handling"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
