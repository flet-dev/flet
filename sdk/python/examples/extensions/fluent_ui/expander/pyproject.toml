[project]
name = "fluent-ui-expander"
version = "1.0.0"
description = "Expander with advanced options and a change callback."
requires-python = ">=3.10"
keywords = ["fluent", "expander", "collapsible", "accordion"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent Expander"
controls = ["SafeArea", "Column", "Text", "Expander", "Checkbox"]
layout_pattern = "sections"
complexity = "basic"
features = ["change handling", "leading icon"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
