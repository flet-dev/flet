[project]
name = "fluent-ui-button"
version = "1.0.0"
description = "Standard button that discards changes, next to a disabled one."
requires-python = ">=3.10"
keywords = ["fluent", "button"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent Button"
controls = ["SafeArea", "Column", "Row", "Text", "Button"]
layout_pattern = "inline-actions"
complexity = "basic"
features = ["click handling", "disabled state"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
