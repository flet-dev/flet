[project]
name = "fluent-ui-combo-box"
version = "1.0.0"
description = "Color picker built from a combo box."
requires-python = ">=3.10"
keywords = ["fluent", "combo box", "dropdown", "select"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent ComboBox"
controls = ["SafeArea", "Column", "Text", "ComboBox", "ComboBoxItem"]
layout_pattern = "form"
complexity = "basic"
features = ["change handling", "placeholder"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
