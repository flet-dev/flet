[project]
name = "fluent-ui-toggle-switch"
version = "1.0.0"
description = "Wi-Fi and Bluetooth switches with labels before and after."
requires-python = ">=3.10"
keywords = ["fluent", "switch", "toggle"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent ToggleSwitch"
controls = ["SafeArea", "Column", "Text", "ToggleSwitch"]
layout_pattern = "form"
complexity = "basic"
features = ["change handling", "label position", "disabled state"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
