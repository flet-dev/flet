[project]
name = "fluent-ui-auto-suggest-box"
version = "1.0.0"
description = "City search box with filtered suggestions."
requires-python = ">=3.10"
keywords = ["fluent", "autocomplete", "search", "suggestions"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent AutoSuggestBox"
controls = ["SafeArea", "Column", "Text", "AutoSuggestBox", "AutoSuggestBoxItem"]
layout_pattern = "form"
complexity = "basic"
features = ["suggestions", "selection handling"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
