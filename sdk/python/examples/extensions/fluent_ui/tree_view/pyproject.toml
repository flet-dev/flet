[project]
name = "fluent-ui-tree-view"
version = "1.0.0"
description = "Pick the folders to back up from a folder tree."
requires-python = ">=3.10"
keywords = ["fluent", "tree view", "tree", "folders"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent TreeView"
controls = ["SafeArea", "Column", "Text", "TreeView", "TreeViewItem"]
layout_pattern = "list"
complexity = "basic"
features = ["multiple selection", "nested items"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
