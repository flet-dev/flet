[project]
name = "fluent-ui-toggle-button"
version = "1.0.0"
description = "Bold toggle that changes the weight of a text preview."
requires-python = ">=3.10"
keywords = ["fluent", "toggle button", "toggle"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent ToggleButton"
controls = ["SafeArea", "Column", "Text", "ToggleButton"]
layout_pattern = "form"
complexity = "basic"
features = ["change handling"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
