[project]
name = "fluent-ui-icon-button"
version = "1.0.0"
description = "Icon buttons for favorite, share and delete with tooltips."
requires-python = ">=3.10"
keywords = ["fluent", "icon button", "icons", "toolbar"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent IconButton"
controls = ["SafeArea", "Column", "Row", "Text", "IconButton"]
layout_pattern = "inline-actions"
complexity = "basic"
features = ["click handling", "icon change", "tooltips", "disabled state"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
