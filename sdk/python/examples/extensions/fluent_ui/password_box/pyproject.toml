[project]
name = "fluent-ui-password-box"
version = "1.0.0"
description = "New password box with a reveal button and a strength hint."
requires-python = ">=3.10"
keywords = ["fluent", "password", "input"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent PasswordBox"
controls = ["SafeArea", "Column", "Text", "PasswordBox"]
layout_pattern = "form"
complexity = "basic"
features = ["change handling", "reveal mode"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
