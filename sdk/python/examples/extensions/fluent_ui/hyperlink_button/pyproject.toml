[project]
name = "fluent-ui-hyperlink-button"
version = "1.0.0"
description = "Sign-in form with a Forgot password? link button."
requires-python = ">=3.10"
keywords = ["fluent", "hyperlink button", "link"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-fluent-ui"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Fluent"]

[tool.flet.metadata]
title = "Fluent HyperlinkButton"
controls = ["SafeArea", "Column", "Row", "Text", "HyperlinkButton", "TextBox", "FilledButton"]
layout_pattern = "inline-actions"
complexity = "basic"
features = ["click handling", "link"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
