[project]
name = "notifications"
version = "1.0.0"
description = "Shows, schedules and cancels local notifications, with channels, actions and typed tap handlers."
requires-python = ">=3.10"
keywords = ["services", "notifications", "scheduling", "channels", "actions", "async"]
authors = [{ name = "Flet team", email = "hello@flet.dev" }]
dependencies = ["flet", "flet-notifications"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Utility/Notifications"]

[tool.flet.metadata]
title = "Notifications"
controls = ["Page", "AppBar", "Column", "Container", "Divider", "OutlinedButton", "Text", "LocalNotifications"]
layout_pattern = "control-panel"
complexity = "advanced"
features = ["local notifications", "scheduling", "channels", "actions", "typed tap handlers"]

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.android]
gradle_dependencies = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'

[tool.flet.android.compile_options]
isCoreLibraryDesugaringEnabled = "true"

[tool.flet.android.permission]
POST_NOTIFICATIONS = true
VIBRATE = true
RECEIVE_BOOT_COMPLETED = true
SCHEDULE_EXACT_ALARM = true

[tool.flet.android.receiver."com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver"]
exported = false

[tool.flet.android.receiver."com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"]
exported = false

[tool.flet.android.receiver."com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"]
exported = false

[[tool.flet.android.receiver."com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver".intent_filter]]
actions = [
    "android.intent.action.BOOT_COMPLETED",
    "android.intent.action.MY_PACKAGE_REPLACED",
    "android.intent.action.QUICKBOOT_POWERON",
    "com.htc.intent.action.QUICKBOOT_POWERON",
]
